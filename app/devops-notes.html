<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DevOps Quick Notes</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('linuxStudyTheme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="tool-module.css"></head><body><div class="app-shell module-shell"><aside class="sidebar" id="sidebar"><a class="brand" href="devops-notes.html"><span class="brand-mark"><i class="bi bi-journal-text"></i></span><span>DevOps Notes</span></a><nav><ul class="nav-list"><li><a class="nav-link active" href="#editor"><i class="bi bi-pencil"></i>Quick Notes</a></li><li><a class="nav-link" href="#saved"><i class="bi bi-collection"></i>Saved Notes</a></li><li><a class="nav-link nav-label-secondary" href="devops.html"><i class="bi bi-grid"></i>DevOps Hub</a></li><li><a class="nav-link" href="devops-backup.html"><i class="bi bi-floppy"></i>Backup & Restore</a></li></ul></nav></aside><button class="sidebar-overlay" id="sidebarOverlay"></button><main class="main"><div class="main-inner module-main-inner"><header class="topbar"><div><p class="eyebrow">Notes across the whole platform</p><h1>Quick Notes</h1><p class="topbar-copy">Save commands, interview points, troubleshooting findings and project notes per DevOps tool.</p></div><div class="top-actions"><a class="btn btn-secondary" href="devops.html">DevOps Hub</a><button class="mobile-menu-button" id="mobileMenuButton"><i class="bi bi-list"></i><span>Menu</span></button></div></header><section class="section-block" id="editor"><article class="panel" style="padding:22px"><div class="tool-heading"><div><p class="panel-kicker">Write</p><h2>Tool note</h2></div><select id="noteTool" class="module-search" style="min-height:44px"></select></div><input id="noteTitle" class="module-search" style="width:100%;margin:12px 0" placeholder="Note title"><textarea id="noteBody" style="width:100%;min-height:260px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit" placeholder="Write commands, WHY, troubleshooting, interview notes..."></textarea><div class="button-row" style="margin-top:12px"><button class="btn btn-primary" id="saveNote">Save note</button><button class="btn btn-secondary" id="clearNote">Clear editor</button></div></article></section><section class="section-block" id="saved"><div class="section-heading module-heading tool-heading"><div><p class="panel-kicker">Saved locally</p><h2>Your notes</h2></div><label class="module-search"><i class="bi bi-search"></i><input id="noteSearch" type="search" placeholder="Search notes..."></label></div><div class="curriculum-grid" id="notesGrid"></div></section></div></main></div><script src="devops-tool-data.js"></script><script>(function(){const $=id=>document.getElementById(id),key='devopsQuickNotesV1',custom=['Linux','Git','GitHub','GitLab'],mods=Object.values(window.DEVOPS_MODULES||{}).map(x=>x.name),tools=[...new Set([...custom,...mods])].sort();$('noteTool').innerHTML=tools.map(x=>`<option>${x}</option>`).join('');let notes=[];try{notes=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}function saveAll(){localStorage.setItem(key,JSON.stringify(notes))}function render(){const q=($('noteSearch').value||'').toLowerCase();const list=notes.filter(n=>!q||[n.tool,n.title,n.body].join(' ').toLowerCase().includes(q));$('notesGrid').innerHTML=list.length?list.map(n=>`<article class="panel curriculum-card"><p class="panel-kicker">${n.tool}</p><h3>${n.title||'Untitled note'}</h3><pre style="white-space:pre-wrap;color:var(--muted)">${n.body.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre><button class="btn btn-secondary" data-del="${n.id}">Delete</button></article>`).join(''):'<div class="module-empty">No notes yet.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{notes=notes.filter(n=>String(n.id)!==b.dataset.del);saveAll();render()})}$('saveNote').onclick=()=>{const body=$('noteBody').value.trim();if(!body)return;notes.unshift({id:Date.now(),tool:$('noteTool').value,title:$('noteTitle').value.trim(),body,updated:new Date().toISOString()});saveAll();$('noteTitle').value='';$('noteBody').value='';render()};$('clearNote').onclick=()=>{$('noteTitle').value='';$('noteBody').value=''};$('noteSearch').oninput=render;render();const s=$('sidebar'),o=$('sidebarOverlay'),m=$('mobileMenuButton');m.onclick=()=>{const x=s.classList.toggle('open');document.body.classList.toggle('sidebar-open',x)};o.onclick=()=>{s.classList.remove('open');document.body.classList.remove('sidebar-open')};})();</script></body></html>
